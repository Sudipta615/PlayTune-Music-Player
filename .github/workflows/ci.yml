name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            qt6-base-dev \
            libasound2-dev \
            libdbus-1-dev

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install qt@6 cmake ninja pkg-config
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> $GITHUB_ENV

      - name: Install Windows Qt6
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          arch: 'win64_msvc2022_64'

      - name: Export Qt path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "QT6_DIR=$env:QT6_DIR"
          Write-Host "Qt_DIR=$env:Qt_DIR"
          Write-Host "CMAKE_PREFIX_PATH=$env:CMAKE_PREFIX_PATH"
          Get-ChildItem Env: | Where-Object { $_.Name -match "Qt|QT|CMAKE" } | Sort-Object Name
          if ($env:Qt6_DIR) {
            echo "CMAKE_PREFIX_PATH=$env:Qt6_DIR" >> $env:GITHUB_ENV
          } elseif ($env:QT6_DIR) {
            echo "CMAKE_PREFIX_PATH=$env:QT6_DIR" >> $env:GITHUB_ENV
          } elseif ($env:Qt_DIR) {
            echo "CMAKE_PREFIX_PATH=$env:Qt_DIR" >> $env:GITHUB_ENV
          } else {
            Write-Error "No Qt installation environment variable found."
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --workspace

      - name: Build Release
        run: cargo build --workspace --release

      - name: Package Binary Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/playtune.exe dist/playtune-windows-x86_64.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp target/release/playtune dist/playtune-macos-x86_64
          else
            cp target/release/playtune dist/playtune-linux-x86_64
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playtune-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
