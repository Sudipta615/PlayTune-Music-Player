<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#10152b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2140"/>
      <stop offset="100%" stop-color="#131a30"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c2a4a"/>
      <stop offset="100%" stop-color="#1a1f42"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowWhite" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00F2FE"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6B6B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="url(#bgGrad)" rx="24"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" font-size="25" font-weight="700" fill="#f2f4fb">PlayTune — Architecture &#38; DSP Pipeline</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#8b95b3">Lock-free FFI bridge between the native Qt6 GUI and the zero-allocation Rust audio engine</text>

  <!-- Legend -->
  <circle cx="330" cy="70" r="5" fill="#00F2FE"/>
  <text x="341" y="74" font-size="11" fill="#9aa4c4">Frontend</text>
  <circle cx="415" cy="70" r="5" fill="#B388FF"/>
  <text x="426" y="74" font-size="11" fill="#9aa4c4">FFI Bridge</text>
  <circle cx="500" cy="70" r="5" fill="#FF6B6B"/>
  <text x="511" y="74" font-size="11" fill="#9aa4c4">Backend</text>
  <circle cx="580" cy="70" r="5" fill="#41CD52"/>
  <text x="591" y="74" font-size="11" fill="#9aa4c4">Output</text>

  <!-- FRONTEND SECTION -->
  <rect x="20" y="85" width="1160" height="210" rx="20" fill="none" stroke="#00F2FE" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="45" y="112" font-size="14" font-weight="700" fill="#5fd9e6" letter-spacing="1">QT6 C++ NATIVE FRONTEND</text>

  <g filter="url(#softShadow)">
    <rect x="40" y="130" width="265" height="130" rx="16" fill="url(#cardGrad)" stroke="#00F2FE" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="325" y="130" width="265" height="130" rx="16" fill="url(#cardGrad)" stroke="#00F2FE" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="610" y="130" width="265" height="130" rx="16" fill="url(#cardGrad)" stroke="#00F2FE" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="895" y="130" width="265" height="130" rx="16" fill="url(#cardGrad)" stroke="#00F2FE" stroke-opacity="0.55" stroke-width="1.5"/>
  </g>

  <text x="172.5" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#eef1fb">MainWindow</text>
  <text x="172.5" y="207" text-anchor="middle" font-size="13" fill="#9aa4c4">&#38; Sidebar</text>

  <text x="457.5" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#eef1fb">3-Tab Equalizer</text>
  <text x="457.5" y="207" text-anchor="middle" font-size="13" fill="#9aa4c4">Panel</text>

  <text x="742.5" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#eef1fb">Now Playing Card</text>
  <text x="742.5" y="207" text-anchor="middle" font-size="13" fill="#9aa4c4">&#38; Queue</text>

  <text x="1027.5" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#eef1fb">Real-Time FFT</text>
  <text x="1027.5" y="207" text-anchor="middle" font-size="13" fill="#9aa4c4">Surface</text>

  <!-- BRIDGE -->
  <text x="600" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#B388FF" letter-spacing="1">LOCK-FREE C/FFI BRIDGE</text>
  <g filter="url(#softShadow)">
    <rect x="350" y="335" width="500" height="90" rx="18" fill="url(#bridgeGrad)" stroke="#B388FF" stroke-width="2"/>
  </g>
  <text x="600" y="375" text-anchor="middle" font-size="15" font-weight="600" fill="#eef1fb">bridge.rs</text>
  <text x="600" y="396" text-anchor="middle" font-size="12" fill="#9aa4c4">PlaybackInfo (ArcSwap) · atomic, allocation-free reads</text>

  <!-- BACKEND SECTION -->
  <rect x="20" y="475" width="1160" height="300" rx="20" fill="none" stroke="#FF6B6B" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="45" y="502" font-size="14" font-weight="700" fill="#ff9b9b" letter-spacing="1">RUST AUDIO &#38; DB ENGINE</text>

  <g filter="url(#softShadow)">
    <rect x="40" y="525" width="212" height="140" rx="16" fill="url(#cardGrad)" stroke="#FF6B6B" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="267" y="525" width="212" height="140" rx="16" fill="url(#cardGrad)" stroke="#FF6B6B" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="494" y="525" width="212" height="140" rx="16" fill="url(#cardGrad)" stroke="#FF6B6B" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="721" y="525" width="212" height="140" rx="16" fill="url(#cardGrad)" stroke="#FF6B6B" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="948" y="525" width="212" height="140" rx="16" fill="url(#cardGrad)" stroke="#FF6B6B" stroke-opacity="0.55" stroke-width="1.5"/>
  </g>

  <text x="146" y="583" text-anchor="middle" font-size="15" font-weight="600" fill="#eef1fb">Ticker Thread</text>
  <text x="146" y="602" text-anchor="middle" font-size="12" fill="#9aa4c4">30ms loop</text>

  <text x="373" y="583" text-anchor="middle" font-size="15" font-weight="600" fill="#eef1fb">Engine</text>
  <text x="373" y="602" text-anchor="middle" font-size="12" fill="#9aa4c4">Symphonia + Rubato</text>

  <text x="600" y="576" text-anchor="middle" font-size="15" font-weight="600" fill="#eef1fb">DSP Pipeline</text>
  <text x="600" y="595" text-anchor="middle" font-size="12" fill="#9aa4c4">EQ / Limiter /</text>
  <text x="600" y="611" text-anchor="middle" font-size="12" fill="#9aa4c4">Crossfade</text>

  <text x="827" y="583" text-anchor="middle" font-size="15" font-weight="600" fill="#eef1fb">DB</text>
  <text x="827" y="602" text-anchor="middle" font-size="12" fill="#9aa4c4">rusqlite (WAL)</text>

  <text x="1054" y="583" text-anchor="middle" font-size="15" font-weight="600" fill="#eef1fb">Device Monitor</text>
  <text x="1054" y="602" text-anchor="middle" font-size="12" fill="#9aa4c4">5s poll</text>

  <!-- SPEAKERS -->
  <g filter="url(#softShadow)">
    <rect x="480" y="815" width="240" height="70" rx="16" fill="url(#cardGrad)" stroke="#41CD52" stroke-width="2"/>
  </g>
  <text x="600" y="845" text-anchor="middle" font-size="15" font-weight="600" fill="#eef1fb">System Audio Output</text>
  <text x="600" y="863" text-anchor="middle" font-size="12" fill="#9aa4c4">Speakers</text>

  <!-- ARROWS: Frontend <-> Bridge -->
  <line x1="172.5" y1="260" x2="420" y2="335" stroke="#c9d1d9" stroke-width="1.8" marker-end="url(#arrowWhite)" marker-start="url(#arrowWhite)"/>
  <line x1="457.5" y1="260" x2="500" y2="335" stroke="#c9d1d9" stroke-width="1.8" marker-end="url(#arrowWhite)" marker-start="url(#arrowWhite)"/>
  <line x1="742.5" y1="260" x2="650" y2="335" stroke="#c9d1d9" stroke-width="1.8" marker-end="url(#arrowWhite)" marker-start="url(#arrowWhite)"/>

  <!-- Bridge -.-> FFT (dashed, one-way, atomic reads) -->
  <line x1="800" y1="335" x2="1027.5" y2="260" stroke="#00F2FE" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowCyan)"/>
  <text x="935" y="292" text-anchor="middle" font-size="11" font-style="italic" fill="#5fd9e6">atomic reads</text>

  <!-- Bridge <-> Ticker -->
  <line x1="470" y1="425" x2="150" y2="524" stroke="#c9d1d9" stroke-width="1.8" marker-end="url(#arrowWhite)" marker-start="url(#arrowWhite)"/>

  <!-- Ticker -> Engine -->
  <line x1="252" y1="595" x2="266" y2="595" stroke="#c9d1d9" stroke-width="1.8" marker-end="url(#arrowWhite)"/>
  <!-- Engine -> DSP -->
  <line x1="479" y1="595" x2="493" y2="595" stroke="#c9d1d9" stroke-width="1.8" marker-end="url(#arrowWhite)"/>

  <!-- DSP -> Speakers -->
  <line x1="600" y1="665" x2="600" y2="814" stroke="#41CD52" stroke-width="2" marker-end="url(#arrowWhite)"/>
  <text x="615" y="745" font-size="11" font-style="italic" fill="#7fd996">CPAL hardware tap</text>

  <!-- Device Monitor -> Engine (arc above) -->
  <path d="M 1054 524 C 900 435 500 435 375 524" fill="none" stroke="#FF6B6B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="700" y="432" text-anchor="middle" font-size="11" font-style="italic" fill="#ff9b9b">auto-recover signal</text>

  <!-- Ticker <-> DB (arc below) -->
  <path d="M 146 666 C 300 748 650 748 825 666" fill="none" stroke="#00F2FE" stroke-width="1.8" marker-end="url(#arrowCyan)" marker-start="url(#arrowCyan)"/>
  <text x="486" y="765" text-anchor="middle" font-size="11" font-style="italic" fill="#5fd9e6">batched read / write</text>

</svg>
